# Android 15+ (y HyperOS, Lenovo…) exige librerías nativas alineadas a páginas de 16 KB; sin esto
# la app corre en «modo compatible» y el sistema avisa que «no es compatible». Solo objetivos Android.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.i686-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
