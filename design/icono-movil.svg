<!-- Ícono móvil: a sangre completa (Android recorta la forma; iOS no acepta transparencia). El cofre queda en la zona segura central. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A5CFF"/>
      <stop offset="0.55" stop-color="#6236E0"/>
      <stop offset="1" stop-color="#3B1D8C"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g>
    <rect width="1024" height="1024" fill="url(#fondo)"/>
  </g>
  <rect width="1024" height="1024" fill="url(#brillo)"/>
  <path transform="translate(212 199.5) scale(25)" d="M4 10a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v9H4zM4 12h16"
