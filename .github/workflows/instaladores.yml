# Compila los instaladores de Mac (.dmg universal) y Windows (.exe) al crear una etiqueta «v*»
# (por ejemplo v1.0.0) y los deja en un borrador de Release. Solo corre en el repo público.
# El APK de Android se sube a mano (necesita la llave de firma, que no sale del Mac).
name: Instaladores

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    if: github.repository == 'Maggi3Mae/cofre-app'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Cofre ${{ github.ref_name }}
          releaseBody: |
            Instaladores de Cofre. Ver «Instalar» en el README.
            · Mac: Cofre_*_universal.dmg (Apple Silicon e Intel).
            · Windows: Cofre_*_x64-setup.exe (sin probar a fondo todavía).
          releaseDraft: true
          args: ${{ matrix.args }}

      # Corrida manual (sin etiqueta): los instaladores quedan como artefactos de la corrida.
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: cofre-${{ matrix.os }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
